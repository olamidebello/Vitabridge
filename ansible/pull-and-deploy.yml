---
- name: Pull source and deploy website and account service
  ansible.builtin.import_playbook: olamidepanel.yml

- name: Install verified Android preview on the deployed website
  hosts: '{{ deploy_hosts | default("vitabridge") }}'
  become: true
  vars:
    domain: vitabridge.olamidemedical.health
    deploy_root: /var/www/vitabridge
    android_release: https://github.com/olamidebello/Vitabridge/releases/download/android-preview
  tasks:
    - name: Create download directory
      ansible.builtin.file:
        path: '{{ deploy_root }}/current/downloads'
        state: directory
        mode: '0755'
    - name: Download signed preview with SHA-256 verification
      ansible.builtin.get_url:
        url: '{{ android_release }}/VitaBridge-preview.apk'
        dest: '{{ deploy_root }}/current/downloads/VitaBridge-preview.apk'
        checksum: 'sha256:{{ android_release }}/VitaBridge-preview.apk.sha256'
        mode: '0644'
        timeout: 90
    - name: Calculate deployed APK checksum
      ansible.builtin.stat:
        path: '{{ deploy_root }}/current/downloads/VitaBridge-preview.apk'
        checksum_algorithm: sha256
      register: installed_apk
    - name: Publish checksum for installed APK
      ansible.builtin.copy:
        dest: '{{ deploy_root }}/current/downloads/VitaBridge-preview.apk.sha256'
        content: '{{ installed_apk.stat.checksum }}  VitaBridge-preview.apk'
        mode: '0644'
    - name: Point installation page at locally verified APK
      ansible.builtin.replace:
        path: '{{ deploy_root }}/current/install.html'
        regexp: 'https://github.com/olamidebello/Vitabridge/releases/download/android-preview/VitaBridge-preview.apk'
        replace: /downloads/VitaBridge-preview.apk
    - name: Verify public installation page
      ansible.builtin.uri:
        url: 'https://{{ domain }}/install.html'
        return_content: true
        validate_certs: true
      register: install_page
      failed_when: install_page.status != 200 or '/downloads/VitaBridge-preview.apk' not in install_page.content
    - name: Verify public APK is exactly the installed release
      ansible.builtin.get_url:
        url: 'https://{{ domain }}/downloads/VitaBridge-preview.apk'
        dest: /var/lib/vitabridge/public-apk-check.apk
        checksum: 'sha256:{{ installed_apk.stat.checksum }}'
        force: true
        mode: '0600'
        timeout: 90
    - name: Remove verification copy
      ansible.builtin.file:
        path: /var/lib/vitabridge/public-apk-check.apk
        state: absent
    - name: Report deployment
      ansible.builtin.debug:
        msg: 'Website/accounts deployed. Verified Android preview: https://{{ domain }}/downloads/VitaBridge-preview.apk . Public African Apps Store requires its separate store-host update.'
